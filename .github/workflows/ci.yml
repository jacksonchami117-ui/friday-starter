name: FRIDAY CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install test deps
        run: pip install pytest-flask pytest-cov

      - name: Run Pytest with Coverage
        run: |
          pytest -q --disable-warnings --maxfail=1 \
            --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing \
            --junitxml=pytest-report.xml

      - name: Upload Pytest Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: pytest-report.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: friday-logs
          path: state/logs/
          if-no-files-found: ignore

      - name: Generate Coverage Badge
        uses: tj-actions/coverage-badge-py@v2
        with:
          output: coverage.svg
          cov_file: coverage.xml

      - name: Commit Coverage Badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -m "chore(ci): update coverage badge" || echo "no changes"
          git push

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: friday-ci
          fail_ci_if_error: true

      - name: Setup Node (UI build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm install
          npm run build
