name: Deploy — App Runner (CI-only)
on:
  push: { branches: [ main ] }
  workflow_dispatch: {}
  repository_dispatch:
    types: [deploy]
jobs:
  deploy:
    uses: jacksonchami117-ui/friday-starter/.github/workflows/apprunner.yml@main
    with:
      service_name: friday-starter
      ecr_repo: ${{ vars.ECR_REPOSITORY }}
      env_name: production
      port: 5000
    permissions: { id-token: write, contents: read }
