name: Deploy — App Runner (OIDC via AWS Connector)
on:
  push: { branches: [ main ] }
  workflow_dispatch: {}
  repository_dispatch:
    types: [deploy]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SERVICE_NAME: friday-app
  ENVIRONMENT: production
  ECR_REPO: ${{ vars.ECR_REPOSITORY }}
  # ARN of the App Runner ECR access role (pre-created in AWS)
  ECR_ACCESS_ROLE_ARN: ${{ vars.AWS_APPRUNNER_ECR_ACCESS_ROLE }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for GitHub OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via AWS Connector (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEPLOY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          IMG: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "${ECR_REPO}" || aws ecr create-repository --repository-name "${ECR_REPO}"
          docker build -t "$IMG" .
          docker push "$IMG"

      - name: Validate App Runner ECR access role is provided
        run: |
          set -euo pipefail
          if [ -z "${ECR_ACCESS_ROLE_ARN}" ]; then
            echo "ERROR: vars.AWS_APPRUNNER_ECR_ACCESS_ROLE is not set. Set it to the ARN of your App Runner ECR access role." >&2
            exit 1
          fi

      - name: Create or update App Runner service
        id: apprunner
        env:
          REG:      ${{ steps.ecr.outputs.registry }}
          IMG_TAG:  ${{ github.sha }}
          ROLE_ARN: ${{ env.ECR_ACCESS_ROLE_ARN }}
        run: |
          set -euo pipefail
          SVC_NAME="${SERVICE_NAME}-${ENVIRONMENT}"
          IMAGE_URI="${REG}/${ECR_REPO}:${IMG_TAG}"

          SVC_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='${SVC_NAME}'].ServiceArn" --output text)
          if [ -z "$SVC_ARN" ] || [ "$SVC_ARN" = "None" ]; then
            SVC_ARN=$(aws apprunner create-service --service-name "$SVC_NAME" \
              --source-configuration "ImageRepository={ImageIdentifier=${IMAGE_URI},ImageRepositoryType=ECR,ImageConfiguration={Port=5000}},AuthenticationConfiguration={AccessRoleArn=${ROLE_ARN}}" \
              --query 'Service.ServiceArn' --output text)
          else
            aws apprunner update-service --service-arn "$SVC_ARN" \
              --source-configuration "ImageRepository={ImageIdentifier=${IMAGE_URI},ImageRepositoryType=ECR,ImageConfiguration={Port=5000}},AuthenticationConfiguration={AccessRoleArn=${ROLE_ARN}}"
          fi
          echo "SVC_ARN=$SVC_ARN" >> $GITHUB_OUTPUT

      - name: Wait for deployment and smoke test
        run: |
          set -euo pipefail
          ARN="${{ steps.apprunner.outputs.SVC_ARN }}"
          aws apprunner wait service-deployed --service-arn "$ARN"
          URL=$(aws apprunner describe-service --service-arn "$ARN" --query 'Service.ServiceUrl' --output text)
          echo "SERVICE_URL=$URL"
          curl -fsS "$URL/health" -o health.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-artifacts
          path: health.txt
