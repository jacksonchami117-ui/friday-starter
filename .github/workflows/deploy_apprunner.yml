name: Deploy — App Runner (CI-only)

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-apprunner-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_DEPLOY: ${{ vars.AWS_ROLE_DEPLOY }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  STACK_NAME: apprunner-friday-starter-prod
  APP_RUNNER_STACK_NAME: ${{ vars.APP_RUNNER_STACK_NAME }}
  APP_RUNNER_SERVICE_NAME: ${{ vars.APP_RUNNER_SERVICE_NAME }}
  APP_RUNNER_PORT: ${{ vars.APP_RUNNER_PORT }}

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      service_url: ${{ steps.cfn.outputs.service_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_DEPLOY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --build-arg APP_VERSION=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Write App Runner template
        env:
          PORT: ${{ env.APP_RUNNER_PORT }}
        run: |
          PORT=${PORT:-5000}
          mkdir -p infra
          cat > infra/apprunner.yaml <<YAML
          AWSTemplateFormatVersion: '2010-09-09'
          Resources:
            Svc:
              Type: AWS::AppRunner::Service
              Properties:
                ServiceName: ${APP_RUNNER_SERVICE_NAME}
                SourceConfiguration:
                  AutoDeploymentsEnabled: true
                  ImageRepository:
                    ImageIdentifier: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}
                    ImageRepositoryType: ECR
                    ImageConfiguration:
                      Port: '${PORT}'
                      RuntimeEnvironmentVariables:
                        - Name: AUTO_START
                          Value: 'true'
                        - Name: APP_VERSION
                          Value: '${{ github.sha }}'
                  AuthenticationConfiguration:
                    AccessRoleArn: ${AWS_ROLE_DEPLOY}
                HealthCheckConfiguration:
                  Protocol: HTTP
                  Path: /healthz
                  Interval: 10
                  Timeout: 5
                  HealthyThreshold: 1
                  UnhealthyThreshold: 3
          Outputs:
            ServiceUrl:
              Value: !GetAtt Svc.ServiceUrl
          YAML

      - name: Compute stack name
        run: |
          # Precedence: env.STACK_NAME, then vars.STACK_NAME, then vars.APP_RUNNER_STACK_NAME (backward compatibility), else deterministic default
          COMPUTED_STACK_NAME=""
          
          if [ -n "${STACK_NAME:-}" ]; then
            COMPUTED_STACK_NAME="$STACK_NAME"
            echo "Using env.STACK_NAME: $COMPUTED_STACK_NAME"
          elif [ -n "${{ vars.STACK_NAME }}" ]; then
            COMPUTED_STACK_NAME="${{ vars.STACK_NAME }}"
            echo "Using vars.STACK_NAME: $COMPUTED_STACK_NAME"
          elif [ -n "${{ vars.APP_RUNNER_STACK_NAME }}" ]; then
            COMPUTED_STACK_NAME="${{ vars.APP_RUNNER_STACK_NAME }}"
            echo "Using vars.APP_RUNNER_STACK_NAME (backward compatibility): $COMPUTED_STACK_NAME"
          else
            COMPUTED_STACK_NAME="apprunner-friday-starter-$(echo '${{ github.repository }}' | sed 's/.*\///' | sed 's/[^a-zA-Z0-9-]/-/g')"
            echo "Using deterministic default: $COMPUTED_STACK_NAME"
          fi
          
          # Ensure we never have an empty stack name
          if [ -z "$COMPUTED_STACK_NAME" ]; then
            echo "❌ Error: Computed stack name is empty"
            exit 1
          fi
          
          echo "FINAL_STACK_NAME=$COMPUTED_STACK_NAME" >> $GITHUB_ENV
          echo "Final stack name: $COMPUTED_STACK_NAME"

      - name: Deploy CloudFormation
        id: cfn
        run: |
          aws cloudformation deploy \
            --stack-name "$FINAL_STACK_NAME" \
            --template-file infra/apprunner.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          URL=$(aws cloudformation describe-stacks --stack-name "$FINAL_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ServiceUrl`].OutputValue' --output text)
          echo "service_url=$URL" >> $GITHUB_OUTPUT

  smoke_and_screenshot:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Wait for readiness
        env:
          URL: ${{ needs.build_and_push.outputs.service_url }}
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/healthz" || true)
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm -g i playwright@1
          npx playwright install --with-deps

      - name: Screenshot home
        env:
          URL: ${{ needs.build_and_push.outputs.service_url }}
        run: |
          node -e "const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.goto(process.env.URL,{waitUntil:'domcontentloaded'});await p.screenshot({path:'home.png',fullPage:true});await b.close();})();"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: home.png
