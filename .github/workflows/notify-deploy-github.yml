name: Notify on deploy status (GitHub)

on:
  workflow_run:
    workflows: [ "Deploy — App Runner (CI-only)" ]
    types: [ "completed" ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR or commit
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const sha = run.head_sha;
            const conclusion = run.conclusion || 'neutral';
            const runUrl = run.html_url;
            const branch = run.head_branch || '(detached)';
            const trigger = run.event;

            const emoji = {
              success: '✅', failure: '❌', cancelled: '⏹️',
              timed_out: '⏰', neutral: 'ℹ️'
            }[conclusion] || 'ℹ️';

            const body = `${emoji} Deploy — App Runner (CI-only) ${conclusion} on \`${branch}\`
            - Run: ${runUrl}
            - SHA: \`${sha}\`
            - Trigger: \`${trigger}\``;

            const prs = await github.request('GET /repos/{owner}/{repo}/commits/{ref}/pulls', {
              owner, repo, ref: sha,
              mediaType: { previews: ['groot'] }
            });

            if (prs.data.length > 0) {
              const pr = prs.data[0];
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner, repo, commit_sha: sha, body
              });
            }