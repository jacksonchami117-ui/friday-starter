name: Smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start app
        env:
          ADMIN_PASSWORD: ci-admin
          FLASK_SECRET_KEY: testkey
        run: |
          nohup python app.py --port 10000 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for health
        run: |
          echo "Waiting for app to become ready..."
          MAX_ATTEMPTS=45
          SLEEP_INTERVAL=2
          
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Health check attempt $attempt/$MAX_ATTEMPTS"
            
            # Try /healthz first, then fallback to /health for compatibility
            if curl -fsS --max-time 5 http://localhost:10000/healthz > /dev/null 2>&1; then
              echo "✅ App is healthy at /healthz"
              exit 0
            elif curl -fsS --max-time 5 http://localhost:10000/health > /dev/null 2>&1; then
              echo "✅ App is healthy at /health"
              exit 0
            fi
            
            echo "❌ Health check failed, retrying in ${SLEEP_INTERVAL}s..."
            sleep $SLEEP_INTERVAL
          done
          
          echo "💥 App failed to become healthy after $((MAX_ATTEMPTS * SLEEP_INTERVAL)) seconds"
          echo "=== Server logs ==="
          cat server.log || echo "No server logs found"
          echo "=== Process status ==="
          if [ -f server.pid ]; then
            PID=$(cat server.pid)
            ps -p $PID || echo "Process $PID not running"
          fi
          exit 1

      - name: Run smoke test
        env:
          BASE_URL: http://localhost:10000
          ADMIN_PASSWORD: ci-admin
        run: |
          python scripts/smoke_test.py

      - name: Archive outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: |
            state/outputs/videos/**
            state/outputs/thumbs/**
          if-no-files-found: warn

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            server.log
            state/logs/**
          if-no-files-found: warn

      - name: Verify lockfile consistency
        run: |
          pip install pip-tools
          pip-compile --quiet --generate-hashes --output-file requirements.lock requirements.txt
          git diff --exit-code requirements.lock || (echo "❌ requirements.lock drift" && exit 1)

      - name: Run diagnostics self-test
        run: flask diagnostics-selftest
