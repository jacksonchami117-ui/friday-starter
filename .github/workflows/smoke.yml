name: Smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start app
        env:
          ADMIN_PASSWORD: ci-admin
          FLASK_SECRET_KEY: testkey
        run: |
          nohup python app.py --port 10000 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for health
        run: |
          echo "Waiting for app to become ready on port 10000..."
          MAX_ATTEMPTS=45  # ~90 seconds with 2-second intervals
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            # Try /healthz first, then fallback to /health
            if curl -fsS http://localhost:10000/healthz > /dev/null 2>&1; then
              echo "✅ App ready at /healthz"
              exit 0
            elif curl -fsS http://localhost:10000/health > /dev/null 2>&1; then
              echo "✅ App ready at /health"
              exit 0
            fi
            
            # Add exponential backoff for failed attempts
            if [ $ATTEMPT -gt 10 ]; then
              sleep 3
            else
              sleep 2
            fi
          done
          
          echo "❌ App did not become healthy in time"
          echo "==== Server log ===="
          cat server.log || echo "No server log found"
          echo "==== Process status ===="
          ps aux | grep -E "(python|app\.py)" || echo "No Python processes found"
          echo "==== Port status ===="
          netstat -tlnp | grep :10000 || echo "Port 10000 not listening"
          exit 1

      - name: Run smoke test
        env:
          BASE_URL: http://localhost:10000
          ADMIN_PASSWORD: ci-admin
        run: |
          python scripts/smoke_test.py

      - name: Archive outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: |
            state/outputs/videos/**
            state/outputs/thumbs/**
          if-no-files-found: warn

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            server.log
            state/logs/**
          if-no-files-found: warn

      - name: Verify lockfile consistency
        run: |
          pip install pip-tools
          pip-compile --quiet --generate-hashes --output-file requirements.lock requirements.txt
          git diff --exit-code requirements.lock || (echo "❌ requirements.lock drift" && exit 1)

      - name: Run diagnostics self-test
        run: flask diagnostics-selftest
