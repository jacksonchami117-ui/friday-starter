name: Smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start app
        env:
          ADMIN_PASSWORD: ci-admin
          FLASK_SECRET_KEY: testkey
        run: |
          nohup python app.py --port 10000 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for health
        run: |
          echo "Waiting for app to become healthy..."
          START_TIME=$(date +%s)
          TIMEOUT=90
          
          for i in {1..45}; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Timeout after ${ELAPSED}s"
              break
            fi
            
            echo "Attempt $i (${ELAPSED}s elapsed)..."
            
            # Try /healthz first, then /health as fallback
            if curl -fsS http://localhost:10000/healthz > /dev/null 2>&1; then
              echo "✅ /healthz responded successfully"
              exit 0
            elif curl -fsS http://localhost:10000/health > /dev/null 2>&1; then
              echo "✅ /health responded successfully (fallback)"
              exit 0
            fi
            
            # Exponential backoff: start with 1s, then 2s, then cap at 4s
            if [ $i -le 5 ]; then
              sleep 1
            elif [ $i -le 10 ]; then
              sleep 2
            else
              sleep 4
            fi
          done
          
          echo "🔍 App did not become healthy - collecting diagnostics..."
          echo "=== Server logs ==="
          cat server.log || echo "No server.log found"
          echo ""
          echo "=== Process list ==="
          ps aux | grep -E "(python|app\.py)" || echo "No python processes found"
          echo ""
          echo "=== Bound ports ==="
          netstat -tlnp 2>/dev/null | grep ":10000" || echo "Port 10000 not bound"
          echo ""
          echo "=== Network connections ==="
          ss -tlnp 2>/dev/null | grep ":10000" || echo "No connections on port 10000"
          
          exit 1

      - name: Run smoke test
        env:
          BASE_URL: http://localhost:10000
          ADMIN_PASSWORD: ci-admin
        run: |
          python scripts/smoke_test.py

      - name: Archive outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: |
            state/outputs/videos/**
            state/outputs/thumbs/**
          if-no-files-found: warn

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            server.log
            state/logs/**
          if-no-files-found: warn

      - name: Verify lockfile consistency
        run: |
          pip install pip-tools
          pip-compile --quiet --generate-hashes --output-file requirements.lock requirements.txt
          git diff --exit-code requirements.lock || (echo "❌ requirements.lock drift" && exit 1)

      - name: Run diagnostics self-test
        run: flask diagnostics-selftest
