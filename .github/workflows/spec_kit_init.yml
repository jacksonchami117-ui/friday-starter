name: Spec Kit Init

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -fsSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Run Spec Kit
        run: ~/.local/bin/uvx --from git+https://github.com/github/spec-kit.git specify init .
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(spec-kit): initialize"
