codecov:
  require_ci_to_pass: yes
  notify:
    after_n_builds: 1

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 5%
        if_ci_failed: informational
    patch:
      default:
        target: 70%
        threshold: 5%
        if_ci_failed: informational

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
  require_base: yes
  require_head: yes
