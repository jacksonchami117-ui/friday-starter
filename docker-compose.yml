version: "3.9"

services:
  app:
    build: .
    command: npm run dev
    ports:
      - "8081:8081"
    volumes:
      - .:/usr/src/app
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: friday
    ports:
      - "5432:5432"
