services:
  - type: web
    name: friday-starter
    env: python
    buildCommand: |
      pip install -r requirements.txt
      if [ -d "web" ]; then cd web && npm ci && npm run build; fi
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: STATE_DIR
        value: /data/state
      - key: USE_DB
        value: "1"
    disk:
      name: data
      mountPath: /data
