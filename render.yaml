services:
  - type: web
    name: friday-starter
    env: python
    plan: starter
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg git-lfs
      pip install -r requirements.txt
    startCommand: gunicorn app:app -w 1 -k gthread --threads 4 --timeout 120
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: STATE_DIR
        value: /data/state
      - key: USE_DB
        value: "1"
    services:
  name: friday-starter
        name: friday-starter
        env: python
        plan: starter
        buildCommand: |
          apt-get update && apt-get install -y ffmpeg git-lfs
          git lfs install
          pip install -r requirements.txt
        startCommand: gunicorn app:app -w 1 -k gthread --threads 4 --timeout 120
        envVars:
          - key: ADMIN_PASSWORD
            sync: false
          - key: STATE_DIR
            value: /data/state
          - key: USE_DB
            value: "1"
        disk:
          name: data
          mountPath: /data
