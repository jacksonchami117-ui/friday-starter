services:
  - type: redis
    name: friday-redis
    plan: free

  - type: pserv
    name: friday-postgres
    plan: free

  - type: web
    name: friday-starter
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        value: redis://friday-redis:6379
      - key: DATABASE_URL
        value: postgresql://postgres:postgres@friday-postgres:5432/friday

  - type: worker
    name: friday-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A celery_worker.celery worker --loglevel=info
    envVars:
      - key: REDIS_URL
        value: redis://friday-redis:6379
      - key: DATABASE_URL
        value: postgresql://postgres:postgres@friday-postgres:5432/friday

