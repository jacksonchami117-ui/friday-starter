services:
  - type: web
    name: friday-starter
    env: python
    buildCommand: |
      pip install --upgrade pip --break-system-packages
      pip install -r requirements.txt
      git lfs install
      apt-get update && apt-get install -y ffmpeg
      # force static/logging dirs
      mkdir -p logs
      ls -la static || true
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: STATE_DIR
        value: /data/state
      - key: USE_DB
        value: "1"
