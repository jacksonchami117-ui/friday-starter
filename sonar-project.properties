# SonarCloud project configuration
# Set your project key and organization in GitHub repository variables:
# SONAR_PROJECT_KEY - your project key from SonarCloud
# Add SONAR_TOKEN as a secret in your repository

sonar.projectKey=${env.SONAR_PROJECT_KEY}
sonar.organization=jacksonchami117-ui

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=friday-starter
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.js,**/tests/**,**/test/**,**/__pycache__/**,**/migrations/**,**/static/**,**/templates/**,**/New folder (2)/**

# Language settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8