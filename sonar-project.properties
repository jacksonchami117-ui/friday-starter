# SonarCloud configuration for FRIDAY Starter
# Set SONAR_TOKEN and SONAR_PROJECT_KEY in GitHub secrets

# Replace with your SonarCloud organization key (usually your GitHub username or org)
sonar.organization=jacksonchami117-ui

# Replace with your SonarCloud project key (usually repository name)
sonar.projectKey=jacksonchami117-ui_friday-starter

# Project metadata
sonar.projectName=friday-starter
sonar.projectVersion=1.0

# Source directories
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/migrations/**,**/state/**,**/static/**,**/templates/**,**/*.html,**/*.js,**/*.css,**/tests/**,**/alembic/**

# Test directories  
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Language settings
sonar.python.coverage.reportPaths=coverage.xml

# Code analysis settings
sonar.python.xunit.reportPath=pytest-report.xml

# Disable some rules for Flask apps
sonar.python.S1128.skip=true  # Skip unused import warnings for Flask blueprints