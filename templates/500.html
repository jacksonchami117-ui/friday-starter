<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Server Error</title></head>
<body>
  <h1>500 — Something went wrong</h1>
  {% if message %}<p><b>Detail:</b> {{ message }}</p>{% endif %}
  <p>Check <code>/diagnostics/</code> for logs, or <code>/__debug/templates</code> and <code>/__debug/static</code>.</p>
  <a href="{{ url_for('index') }}">← Back to Home</a>
</body>
</html>
