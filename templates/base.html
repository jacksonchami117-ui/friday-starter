<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FRIDAY{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="theme-dark">
  <aside class="nav-rail" aria-label="Primary">
    <div class="brand">FRIDAY</div>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Dashboard</a>
      <a href="{{ url_for('campaigns.campaigns_home') }}" class="{{ 'active' if request.path.startswith('/campaigns') else '' }}">Campaigns</a>
      <a href="/editor" class="{{ 'active' if request.path.startswith('/editor') else '' }}">Editor</a>
      <a href="/render" class="{{ 'active' if request.path.startswith('/render') else '' }}">Render</a>
      <a href="/diagnostics" class="{{ 'active' if request.path.startswith('/diagnostics') else '' }}">Diagnostics</a>
      <a href="{{ url_for('settings.settings_home') }}" class="{{ 'active' if request.path.startswith('/settings') else '' }}">Settings</a>
    </nav>
    
    {% if current_user and current_user.is_authenticated %}
    <div class="user-info">
      <div class="user-email">{{ current_user.email }}</div>
      <a href="{{ url_for('accounts.logout') }}" class="logout-link">Logout</a>
    </div>
    {% endif %}
    
    <div class="copyright">© 2025 FRIDAY</div>
  </aside>
  <main class="content" role="main">
    {% block content %}{% endblock %}
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
