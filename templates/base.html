<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title if title else "FRIDAY" }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="theme-dark">
  <aside class="nav-rail" aria-label="Primary">
    <div class="brand">FRIDAY</div>
    <nav>
      <a href="/home" class="{{ 'active' if request.path == '/home' or request.path == '/' else '' }}">Home</a>
      <a href="/leads/" class="{{ 'active' if request.path.startswith('/leads') else '' }}">Leads</a>
      <a href="/exports/" class="{{ 'active' if request.path.startswith('/exports') else '' }}">Exports</a>
      <a href="/logs" class="{{ 'active' if request.path.startswith('/logs') else '' }}">Logs</a>
      <a href="/render/start" class="{{ 'active' if request.path.startswith('/render') else '' }}">Render</a>
    </nav>
    <div class="copyright">© 2025 FRIDAY</div>
  </aside>
  <main class="content" role="main">
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="banner {{ 'success' if category == 'success' else ('warning' if category == 'warning' else 'error') }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    {% block content %}{% endblock %}
  </main>
</body>
</html>
