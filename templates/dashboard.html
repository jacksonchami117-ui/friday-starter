{% extends "base.html" %}
{% block content %}
<div class="dashboard">
  <h2>Dashboard</h2>
  <form method="POST" action="/toggle_notify" style="margin-bottom:2em;">
    <label>
      <input type="checkbox" name="notifications_enabled" value="1"
        {% if session.get('notifications_enabled') %}checked{% endif %}> Enable Notifications
    </label>
    <button type="submit">Save</button>
  </form>
  <!-- Existing dashboard content here -->
</div>
{% endblock %}
