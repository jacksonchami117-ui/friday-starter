{% extends "base.html" %}
{% block content %}
<h1>Editor</h1>
<!-- Pitchlane-style Editor -->
<div id="editor-container">
  <div id="timeline">
    <button id="add-page-btn">Add Page</button>
    <button id="add-scroll-btn">Add Scroll</button>
    <ul id="page-list"></ul>
  </div>

  <div id="page-types">
    <select id="page-type-selector">
      <option value="company">Company Website</option>
      <option value="linkedin">LinkedIn Profile</option>
      <option value="custom">Custom URL/Page</option>
      <option value="image">Screenshot/Image</option>
      <option value="mywebsite">My Website</option>
      <option value="outro">Outro</option>
    </select>
  </div>

  <div id="preview">
    <video id="preview-video" controls></video>
  </div>
</div>
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
