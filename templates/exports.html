
{% extends "base.html" %}

{% block content %}
<h1>Exports</h1>

<div>
  <form method="post" action="{{ url_for('exports.make_zip') }}" style="display: inline-block; margin-right: 8px;">
    <button class="btn" type="submit">Download All (ZIP)</button>
  </form>
  <form method="post" action="{{ url_for('exports.make_export_csv') }}" style="display: inline-block; margin-right: 8px;">
    <button class="btn" type="submit">Create exports.csv</button>
  </form>
  <a class="btn" href="{{ url_for('index') }}">← Back to Dashboard</a>
</div>

{% if files %}
<table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
  <thead>
    <tr>
      <th style="border: 1px solid #2a2e3d; padding: 8px; text-align: left; background: var(--panel);">File</th>
      <th style="border: 1px solid #2a2e3d; padding: 8px; text-align: left; background: var(--panel);">Size (bytes)</th>
      <th style="border: 1px solid #2a2e3d; padding: 8px; text-align: left; background: var(--panel);">Action</th>
    </tr>
  </thead>
  <tbody>
    {% for f in files %}
      <tr>
        <td style="border: 1px solid #2a2e3d; padding: 8px;">{{ f.name }}</td>
        <td style="border: 1px solid #2a2e3d; padding: 8px;">{{ f.size }}</td>
        <td style="border: 1px solid #2a2e3d; padding: 8px;">
          <a class="btn" href="{{ url_for('exports.download_file', filename=f.name) }}">Download</a>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
  <p>No output files yet.</p>
{% endif %}
{% endblock %}
