<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Leads</title>
</head>
<body>
  <h1>Upload Leads CSV/XLSX</h1>

  <form action="{{ url_for('leads.upload_leads') }}" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept=".csv,.xlsx" required>
    <button type="submit">Upload</button>
  </form>

  <br>
  <a href="{{ url_for('leads.list_leads') }}">📋 View Uploaded Leads</a> |
  <a href="{{ url_for('index') }}">← Back to Dashboard</a>
</body>
</html>
