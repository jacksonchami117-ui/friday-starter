
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rejected Leads</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #efefef; }
  </style>
</head>
<body>
  <h1>Rejected Leads</h1>
  {% if rows %}
  <table>
    <thead>
      <tr>
        {% for col in rows[0].keys() %}
          <th>{{ col }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
        <tr>
          {% for val in row.values() %}
            <td>{{ val }}</td>
          {% endfor %}
        </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
    <p>No rejected leads.</p>
  {% endif %}
  <br><a href="{{ url_for('leads.leads_home') }}">← Back to Upload</a>
</body>
</html>
